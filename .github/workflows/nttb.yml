
name: NTTB automatisch bijwerken

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

jobs:
  update-nttb:
    runs-on: ubuntu-latest

    steps:
      - name: Project ophalen
        uses: actions/checkout@v4

      - name: Python installeren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright installeren
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: NTTB gegevens ophalen
        run: xvfb-run -a python nttb_beide_teams.py
      - name: JSON bestanden opslaan
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nttb_tios.json nttb_markiezaat.json
          if ! git diff --cached --quiet; then
            git commit -m "NTTB gegevens bijgewerkt"
            git push
          fi
